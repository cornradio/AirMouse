<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web-AirMouse | 网页体感飞鼠</title>
    <link rel="icon" type="image/png" href="/static/touchpad.png">
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            outline: none;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
        }

        #mouse-page {
            display: flex;
            width: 100vw;
            height: 100%;
        }

        #pad {
            flex: 1;
            background: #0a0a0a;
            position: relative;
        }

        /* 顶部/左侧栏：功能开关 */
        .top-nav {
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-color: #1a1a1a;
            border-style: solid;
        }

        /* 底部/右侧栏：鼠标按键与灵敏度 */
        .bottom-nav {
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-color: #1a1a1a;
            border-style: solid;
        }

        @media (orientation: portrait) {
            #mouse-page {
                flex-direction: column;
            }

            .top-nav {
                height: 60px;
                width: 100%;
                border-bottom-width: 1px;
            }

            .bottom-nav {
                height: 75px;
                width: 100%;
                border-top-width: 1px;
                padding: 0 10px;
            }

            .btn-group {
                display: flex;
                gap: 10px;
            }

            /* 竖屏也折叠 PAD/GYRO；展开面板浮在底栏上方。 */
            .bottom-nav > #sens-settings.expanded {
                right: calc(60px + 12px + env(safe-area-inset-right));
                bottom: calc(75px + 12px + env(safe-area-inset-bottom));
                width: min(280px, calc(100vw - 90px));
            }
        }

        @media (orientation: landscape) {
            #mouse-page {
                flex-direction: row;
            }

            .top-nav {
                width: 65px;
                height: 100%;
                flex-direction: column;
                border-right-width: 1px;
                padding: 20px 0;
            }

            .bottom-nav {
                width: 80px;
                height: 100%;
                flex-direction: column-reverse;
                border-left-width: 1px;
                padding: 15px 0;
            }

            /* 横屏浮层向左避开右侧工具栏和右下角快捷按钮。 */
            .bottom-nav > #sens-settings.expanded {
                right: calc(80px + 68px + env(safe-area-inset-right));
                bottom: calc(12px + env(safe-area-inset-bottom));
                width: min(280px, calc(100vw - 180px));
            }

            .btn-group {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            /* 横屏把陀螺仪开关收进与 PAD 灵敏度相同的折叠面板。 */
            #gyro-btn {
                display: none !important;
            }
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            color: #ddd;
            cursor: pointer;
        }

        .back-btn svg { fill: currentColor; width: 24px; height: 24px; }

        .sens-toggle {
            display: flex;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            border: 1px solid #292929;
            border-radius: 12px;
            background: #151515;
            color: #aaa;
        }

        .sens-toggle svg { width: 22px; height: 22px; fill: currentColor; }
        .sens-toggle[aria-expanded="true"] { color: #fff; border-color: #007AFF; background: #001a33; }

        .mode-btn {
            min-width: 48px;
            height: 40px;
            padding: 0 7px;
            border: 1px solid #292929;
            border-radius: 10px;
            background: #151515;
            color: #888;
            font-size: 11px;
            font-weight: 700;
        }

        .mode-btn[aria-pressed="true"] {
            color: #fff;
            border-color: #007AFF;
            background: #001a33;
        }

        .icon-btn:active {
            background: #333;
            transform: scale(0.95);
        }

        .icon-btn svg {
            fill: #888;
            width: 24px;
            height: 24px;
        }

        .icon-btn.active {
            border-color: #007AFF;
            background: #001a33;
        }

        .icon-btn.active svg {
            fill: #007AFF;
            filter: drop-shadow(0 0 5px #007AFF);
        }

        .side-text {
            color: #888;
            font-size: 9px;
            font-weight: bold;
        }

        .icon-btn:active .side-text {
            color: #fff;
        }

        .sens-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .bottom-nav > #sens-settings {
            display: none;
        }

        .bottom-nav > .sens-toggle {
            display: flex;
        }

        /* 竖屏、横屏共用横向 PAD/GYRO 折叠浮层。 */
        .bottom-nav > #sens-settings.expanded {
            display: flex;
            position: fixed;
            height: auto !important;
            margin: 0;
            padding: 14px !important;
            writing-mode: horizontal-tb;
            transform: none;
            gap: 14px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            z-index: 1200;
        }

        .bottom-nav > #sens-settings.expanded .sens-container {
            width: 100%;
            color: #aaa;
            font-size: 11px;
        }

        .bottom-nav > #sens-settings.expanded .sens-container span {
            width: 42px;
        }

        .bottom-nav > #sens-settings.expanded input[type=range] {
            width: 170px;
            height: 24px;
        }

        .mac-floating-actions {
            display: none;
            position: fixed;
            right: calc(80px + 14px + env(safe-area-inset-right));
            bottom: calc(14px + env(safe-area-inset-bottom));
            flex-direction: column;
            gap: 9px;
            z-index: 1100;
        }

        #mouse-page.mac-mode.mac-shortcuts-enabled #mac-floating-actions {
            display: flex;
        }

        .mac-floating-action {
            width: 42px;
            height: 42px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: rgba(26, 26, 26, 0.92);
            border: 1px solid #424242;
            border-radius: 13px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        .mac-floating-action:active {
            background: #003d80;
            border-color: #007AFF;
            transform: scale(0.94);
        }

        .mac-floating-action svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        @media (orientation: portrait) {
            .mac-floating-actions {
                right: calc(14px + env(safe-area-inset-right));
                bottom: calc(75px + 14px + 42px + 12px + env(safe-area-inset-bottom));
            }
        }

        .quick-scroll-up-button {
            display: none;
            position: fixed;
            z-index: 1100;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            padding: 0;
            right: calc(80px + 14px + env(safe-area-inset-right));
            bottom: calc(14px + env(safe-area-inset-bottom));
            color: #fff;
            background: rgba(26, 26, 26, 0.92);
            border: 1px solid #424242;
            border-radius: 13px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            touch-action: manipulation;
        }

        .quick-scroll-up-button svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .quick-scroll-up-button:active {
            background: #003d80;
            border-color: #007AFF;
            transform: scale(0.94);
        }

        @media (orientation: portrait) {
            .quick-scroll-up-button {
                display: flex;
                right: calc(14px + env(safe-area-inset-right));
                bottom: calc(75px + 14px + env(safe-area-inset-bottom));
            }
        }

        @media (orientation: landscape) {
            .quick-scroll-up-button {
                display: flex;
            }

            /* 常用滚动按钮占据最下方，Mac 快捷按钮上移一格避免遮挡。 */
            .mac-floating-actions {
                bottom: calc(14px + 42px + 12px + env(safe-area-inset-bottom));
            }
        }

        .sens-container {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #444;
            font-size: 8px;
            font-weight: bold;
        }

        .sens-container span {
            width: 32px;
        }

        input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            background: #222;
            height: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #555;
            border: 1px solid #000;
        }

        #gyro-slider::-webkit-slider-thumb {
            background: #007AFF;
        }

        /* 更多菜单样式 */
        .menu-container {
            position: relative;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 0;
            z-index: 1000;
            min-width: 120px;
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            overflow-y: auto;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            scrollbar-width: thin;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        /* 全局 touch-action:none 会阻止滚动容器的手势，菜单链路单独允许纵向触摸滚动。 */
        html, body, #mouse-page, .top-nav, .menu-container, .menu-dropdown, .menu-dropdown * {
            touch-action: pan-y;
        }

        @media (orientation: portrait) {
            .menu-dropdown {
                right: 0;
                top: 60px;
            }
        }

        @media (orientation: landscape) {
            .menu-dropdown {
                position: fixed;
                left: calc(65px + 8px + env(safe-area-inset-left));
                top: calc(8px + env(safe-area-inset-top));
                max-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            }
        }

        .menu-dropdown.show {
            display: block;
        }

        .menu-item {
            padding: 10px 16px;
            font-size: 13px;
            color: #ccc;
            white-space: nowrap;
        }

        .menu-item:active {
            background: #333;
            color: #fff;
        }

        .menu-separator {
            height: 1px;
            margin: 5px 12px;
            background: #333;
        }

        /* macOS 的系统空间快捷键只在 Mac 输入模式下展示。 */
        .mac-only {
            display: none;
        }

        #mouse-page.mac-mode .mac-only {
            display: block;
        }
    </style>
</head>

<body>
    <div id="mouse-page" onclick="handleFirstInteraction()">
        <div class="top-nav">
            <div class="icon-btn back-btn" role="button" tabindex="0" aria-label="返回主页"
                title="返回主页" onclick="feedback(); window.location.href='/'">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" /></svg>
            </div>
            <button class="mode-btn" id="os-mode-btn" type="button" aria-pressed="false"
                onclick="v(); toggleInputMode()">Win</button>
            <div class="icon-btn" onclick="feedback(); window.location.href = '/k';">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M20,5H4C2.89,5 2,5.89 2,7V17A2,2 0 0,0 4,19H20A2,2 0 0,0 22,17V7A2,2 0 0,0 20,5M5,7H7V9H5V7M5,11H7V13H5V11M5,15H7V17H5V15M19,17H9V15H19V17M19,13H17V11H19V13M19,9H17V7H19V9M15,13H13V11H15V13M15,9H13V7H15V9M11,13H9V11H11V13M11,9H9V7H11V9Z" />
                </svg>
            </div>
            <div class="icon-btn" onclick="v(); window.location.href = '/v';">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z" />
                </svg>
            </div>
            <div class="icon-btn" onclick="v(); toggleFullScreen()">
                <svg id="fs-icon" viewBox="0 0 24 24">
                    <path d="M5,5H10V7H7V10H5V5M14,5H19V10H17V7H14V5M17,14H19V19H14V17H17V14M10,17V19H5V14H7V17H10Z" />
                </svg>
            </div>

            <div class="icon-btn" id="gyro-btn" onclick="v(); toggleGyro()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z" />
                </svg>
            </div>
            <div class="menu-container">
                <div class="icon-btn" onclick="v(); toggleMenu()">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,16A2,2 0 0,1 14,18A2,2 0 0,1 12,20A2,2 0 0,1 10,18A2,2 0 0,1 12,16M12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12A2,2 0 0,1 12,10M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4Z" />
                    </svg>
                </div>
                <div id="more-menu" class="menu-dropdown">
                    <div class="menu-item" onclick="v(); socket.emit('click', {button:'middle'})">中键单击</div>
                    <div class="menu-item" onclick="quickScroll(4)">快速滚动 ↑</div>
                    <div class="menu-item" onclick="quickScroll(-4)">快速滚动 ↓</div>
                    <div class="menu-item" id="drag-shortcut" onclick="toggleDragShortcut(this)">切换拖拽按键</div>
                    <div id="mac-shortcuts" class="mac-only">
                        <div class="menu-separator" role="separator"></div>
                        <div class="menu-item" onclick="emitMacShortcut(['ctrl', 'up'])">调度中心</div>
                        <div class="menu-item" onclick="emitMacShortcut(['ctrl', 'down'])">应用窗口</div>
                        <div class="menu-item" onclick="emitMacShortcut(['fn', 'f11'])">显示桌面</div>
                        <div class="menu-item" onclick="emitMacShortcut(['ctrl', 'left'])">上一个全屏应用</div>
                        <div class="menu-item" onclick="emitMacShortcut(['ctrl', 'right'])">下一个全屏应用</div>
                        <div class="menu-item" onclick="emitMacClick('x1')">上一页</div>
                        <div class="menu-item" onclick="emitMacClick('x2')">下一页</div>
                    </div>
                    <!-- <div class="menu-item" onclick="v(); window.location.href='/r'">RealMouse (摇杆)</div> -->
                    <div class="menu-item" onclick="v(); window.location.href='/controller'">controller (手柄映射)</div>
                    <div class="menu-item" onclick="v(); window.location.href='/b'">Macro Deck (快捷键)</div>
                    <!-- 以后可以在这里添加更多趣玩页面 -->
                </div>
            </div>
        </div>

        <div id="pad">
            <div
                style="position:absolute; bottom:20px; left:20px; color:#1a1a1a; font-size:10px; font-weight:bold; letter-spacing: 2px; pointer-events: none;">
                WEB-AIRMOUSE PRO</div>
        </div>

        <div class="bottom-nav">
            <div class="btn-group">
                <div class="icon-btn" ontouchstart="v(); startScroll(2)" ontouchend="stopScroll()">
                    <svg viewBox="0 0 24 24">
                        <path d="M7.41,15.41L12,10.83L16.59,15.41L18,14L12,8L6,14L7.41,15.41Z" />
                    </svg>
                </div>
                <div class="icon-btn" ontouchstart="v(); startScroll(-2)" ontouchend="stopScroll()">
                    <svg viewBox="0 0 24 24">
                        <path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z" />
                    </svg>
                </div>
                <div class="icon-btn" id="mid-btn" ontouchstart="handleMid(true, this)"
                    ontouchend="handleMid(false, this)" ontouchcancel="handleMid(false, this)">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,20A2,2 0 0,1 10,18V14.82C8.83,14.43 8,13.32 8,12A4,4 0 0,1 12,8A4,4 0 0,1 16,12C16,13.32 15.17,14.43 14,14.82V18A2,2 0 0,1 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4Z" />
                    </svg>
                </div>
                <div class="icon-btn" onclick="v(); socket.emit('click', {button:'x1'})">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z" />
                    </svg>
                </div>
                <div class="icon-btn" onclick="v(); socket.emit('click', {button:'x2'})">
                    <svg viewBox="0 0 24 24">
                        <path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z" />
                    </svg>
                </div>
            </div>

            <button class="sens-toggle" id="sens-toggle" type="button" aria-label="展开灵敏度设置"
                aria-expanded="false" aria-controls="sens-settings" title="灵敏度设置"
                onclick="toggleSensitivityPanel()">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h9v2H3V7zm13 0h5v2h-5V7zM3 15h5v2H3v-2zm9 0h9v2h-9v-2zM12 5h2v6h-2V5zm-6 8h2v6H6v-6z" /></svg>
            </button>
            <div class="sens-group" id="sens-settings" style="height: 100%; justify-content: space-around; padding: 5px 0;">
                <div class="sens-container"><span>PAD</span><input type="range" id="sens-slider" min="1" max="10"
                        step="0.1"></div>
                <div class="sens-container gyro-sens-row" style="color: #007AFF;"><span>GYRO</span><input type="range"
                        id="gyro-slider" min="0.1" max="5" step="0.1"></div>
            </div>
        </div>

        <div class="mac-floating-actions" id="mac-floating-actions" aria-label="Mac 快捷操作">
            <button class="mac-floating-action" type="button" aria-label="打开调度中心"
                title="调度中心" onclick="emitMacShortcut(['ctrl', 'up'])">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
            </button>
            <button class="mac-floating-action" type="button" aria-label="显示桌面"
                title="显示桌面" onclick="emitMacShortcut(['fn', 'f11'])">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v11h16V5H4z"/></svg>
            </button>
        </div>
        <button class="quick-scroll-up-button" type="button" aria-label="快速滚动向上"
            title="快速滚动 ↑" onclick="quickScroll(4)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/touchpad.js?v=2"></script>
    <script>
        const socket = io();

        // 默认模式由启动网页服务的电脑系统决定；用户仍可在本页临时切换。
        let inputMode = {{ default_input_mode|default('windows')|tojson }};
        function updateInputModeButton() {
            const button = document.getElementById('os-mode-btn');
            const page = document.getElementById('mouse-page');
            page.classList.toggle('mac-mode', inputMode === 'mac');
            page.classList.toggle(
                'mac-shortcuts-enabled',
                localStorage.getItem('show_mac_shortcuts') !== 'false'
            );
            button.innerText = inputMode === 'mac' ? 'Mac' : 'Win';
            button.setAttribute('aria-pressed', inputMode === 'mac' ? 'true' : 'false');
            button.setAttribute('aria-label', `当前输入模式：${inputMode === 'mac' ? 'Mac' : 'Windows'}，点击切换`);
        }
        function toggleInputMode() {
            inputMode = inputMode === 'mac' ? 'windows' : 'mac';
            updateInputModeButton();
        }
        updateInputModeButton();

        // 统一反馈系统：震动 + 音效
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        const feedback = () => {
            // 1. 震动
            if (navigator.vibrate) navigator.vibrate(30);

            // 2. 音效 (Web Audio API)
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; // 纯净的正弦波
                osc.frequency.setValueAtTime(800, audioCtx.currentTime); // 频率 800Hz
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); // 音量 10%
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); // 快速淡出
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        };

        const v = feedback; // 兼容旧代码引用

        let isGyroIntent = localStorage.getItem('gyro_active') === 'true';
        let isGyroActive = false;

        function resetHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            if (window.innerWidth > window.innerHeight && isGyroActive) { toggleGyro(); }
        }
        window.addEventListener('resize', resetHeight);
        resetHeight();

        // 统一初始化 (点击页面任一处触发)
        function handleFirstInteraction() {
            initAudio();
            if (isGyroIntent && !isGyroActive) {
                toggleGyro();
            }
        }

        const slider = document.getElementById('sens-slider');
        const gyroSlider = document.getElementById('gyro-slider');
        let sensitivity = parseFloat(localStorage.getItem('mouse_sense')) || 4.0;
        let gyroSensitivity = parseFloat(localStorage.getItem('gyro_sense')) || 0.6;
        slider.value = sensitivity; gyroSlider.value = gyroSensitivity;

        slider.oninput = (e) => { sensitivity = parseFloat(e.target.value); localStorage.setItem('mouse_sense', sensitivity); };
        gyroSlider.oninput = (e) => { gyroSensitivity = parseFloat(e.target.value); localStorage.setItem('gyro_sense', gyroSensitivity); };

        async function toggleGyro() {
            const btn = document.getElementById('gyro-btn');
            if (!isGyroActive) {
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    const res = await DeviceMotionEvent.requestPermission();
                    if (res !== 'granted') return;
                }
                isGyroActive = true;
                isGyroIntent = true;
                localStorage.setItem('gyro_active', 'true');
                btn.classList.add('active');
                window.addEventListener('devicemotion', handleGyro);
            } else {
                isGyroActive = false;
                isGyroIntent = false;
                localStorage.setItem('gyro_active', 'false');
                btn.classList.remove('active');
                window.removeEventListener('devicemotion', handleGyro);
            }
        }

        function handleGyro(e) {
            const rot = e.rotationRate;
            if (!rot || !Number.isFinite(rot.gamma) || !Number.isFinite(rot.alpha)) return;
            // 获取原始增量
            let rx = -rot.gamma * gyroSensitivity;
            let ry = -rot.alpha * gyroSensitivity;

            // 微小动作滤除 (防手抖死区)
            // 设定 0.25 的死区，低于此值的动作被视为抖动，高于此值则减去死区基数以保持平滑
            const deadzone = 0.25;
            let dx = Math.abs(rx) < deadzone ? 0 : (rx - Math.sign(rx) * deadzone);
            let dy = Math.abs(ry) < deadzone ? 0 : (ry - Math.sign(ry) * deadzone);

            if ((dx !== 0 || dy !== 0) && !touchpad.isLocked()) {
                socket.emit('move', { dx, dy });
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
            else { if (document.exitFullscreen) document.exitFullscreen(); }
        }

        function toggleMenu() {
            document.getElementById('more-menu').classList.toggle('show');
        }

        // macOS provides these system keyboard shortcuts for Mission Control,
        // App Exposé, showing the desktop, and moving between Spaces.
        function emitMacShortcut(keys) {
            if (inputMode !== 'mac') return;
            v();
            socket.emit('key_combo', { keys });
            document.getElementById('more-menu').classList.remove('show');
        }

        // X buttons map to back/forward navigation in apps that support them.
        function emitMacClick(button) {
            if (inputMode !== 'mac') return;
            v();
            socket.emit('click', { button });
            document.getElementById('more-menu').classList.remove('show');
        }

        function toggleSensitivityPanel() {
            const panel = document.getElementById('sens-settings');
            const button = document.getElementById('sens-toggle');
            const expanded = panel.classList.toggle('expanded');
            button.setAttribute('aria-expanded', String(expanded));
            button.setAttribute('aria-label', `${expanded ? '收起' : '展开'}灵敏度设置`);
        }

        // 点击外部关闭菜单
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-container')) {
                document.getElementById('more-menu').classList.remove('show');
            }
        });

        let scrollTimer = null;
        function startScroll(step) {
            if (scrollTimer) clearInterval(scrollTimer);
            socket.emit('scroll', { dy: step });
            scrollTimer = setInterval(() => socket.emit('scroll', { dy: step }), 60);
        }
        function stopScroll() { if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; } }

        // 触屏不便完成三指中键和三指拖拽时，可用菜单中的单击快捷操作代替。
        function quickScroll(step) {
            v();
            socket.emit('scroll', { dy: step, speed: 4 });
            document.getElementById('more-menu').classList.remove('show');
        }

        let dragShortcutActive = false;
        function toggleDragShortcut(button) {
            v();
            dragShortcutActive = !dragShortcutActive;
            socket.emit(dragShortcutActive ? 'drag_start' : 'drag_end');
            button.classList.toggle('active', dragShortcutActive);
            button.textContent = dragShortcutActive ? '释放拖拽按键' : '切换拖拽按键';
            if (dragShortcutActive) document.getElementById('more-menu').classList.remove('show');
        }

        // 页面离开时松开快捷键，避免鼠标左键保持按下。
        window.addEventListener('pagehide', () => {
            if (dragShortcutActive) socket.emit('drag_end');
        });

        function handleMid(down, el) {
            v();
            if (down) {
                socket.emit('mid_down');
                el.classList.add('active');
            } else {
                socket.emit('mid_up');
                el.classList.remove('active');
            }
        }

        const touchpad = new TouchpadModule('pad', socket, {
            getSensitivity: () => sensitivity,
            getMode: () => inputMode,
            getScrollDirection: () => localStorage.getItem('touch_scroll_direction') === 'reverse' ? 'reverse' : 'normal',
            feedback: feedback
        });

    </script>
</body>

</html>
